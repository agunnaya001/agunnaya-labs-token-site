<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="#0f0f0f" />
  
  <!-- Glow Effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main "A" Letter -->
  <g filter="url(#glow)">
    <!-- Left stroke of A -->
    <line x1="70" y1="150" x2="100" y2="50" stroke="url(#neonGreen)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Right stroke of A -->
    <line x1="130" y1="150" x2="100" y2="50" stroke="url(#neonGreen)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Horizontal bar of A -->
    <line x1="75" y1="110" x2="125" y2="110" stroke="url(#neonGreen)" stroke-width="10" stroke-linecap="round" />
  </g>
  
  <!-- Accent Circuit Lines -->
  <line x1="50" y1="100" x2="65" y2="100" stroke="#39FF14" stroke-width="2" opacity="0.6" />
  <line x1="135" y1="100" x2="150" y2="100" stroke="#39FF14" stroke-width="2" opacity="0.6" />
  <circle cx="55" cy="100" r="3" fill="#39FF14" opacity="0.8" />
  <circle cx="145" cy="100" r="3" fill="#39FF14" opacity="0.8" />
</svg>
